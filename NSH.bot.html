<head>

<link rel="manifest" href='data:application/manifest+json,{"name":"NSH.bot","short_name":"NSH.bot","display":"standalone","dir":"rtl","lang":"fa","background_color":"%23101a33","theme_color":"%23101a33"}'>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf3;--card:#fff;--ink:#101a33;--mut:#5d6b88;--line:#d0d8e6;--bot:#fff;--me:#101a33;--meink:#fff;--pr:#c98100;--prbg:#fff3d6;--co:#5b4ccf;--cobg:#ece9ff;--acc:#f2a900;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1f;--card:#131a31;--ink:#e9eefb;--mut:#92a1c2;--line:#26335a;--bot:#172040;--me:#f2a900;--meink:#101a33;--pr:#ffc43d;--prbg:#3a2e0c;--co:#a99cff;--cobg:#241f52}}
:root[data-theme="dark"]{--bg:#0a0f1f;--card:#131a31;--ink:#e9eefb;--mut:#92a1c2;--line:#26335a;--bot:#172040;--me:#f2a900;--meink:#101a33;--pr:#ffc43d;--prbg:#3a2e0c;--co:#a99cff;--cobg:#241f52}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:14px;direction:ltr}
h1{font-size:17px;margin:0;direction:ltr;font-weight:800;text-align:right}
header small{display:block;color:var(--mut);font-size:12px}
.st{margin-inline-start:auto;display:flex;gap:14px;font-size:11px;color:var(--mut);text-align:center}
.st b{display:block;font-size:17px;color:var(--ink)}
.ib{border:1px solid var(--line);background:none;color:var(--ink);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:92%;padding:10px 13px;border-radius:16px;line-height:1.9;font-size:14.5px;word-break:break-word}
.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-top-right-radius:4px;width:92%}
.bot.t{width:auto}
.me{background:var(--me);color:var(--meink);align-self:flex-end;border-top-left-radius:4px;direction:auto;font-weight:600}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.vd{border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.vd.p{background:var(--prbg);color:var(--pr)}.vd.c{background:var(--cobg);color:var(--co)}.vd.z{background:var(--bg);color:var(--mut)}
.vn{font-size:19px;font-weight:800;overflow-wrap:anywhere;min-width:0}
.vt{font-weight:800;font-size:15px;white-space:nowrap}
.fx{display:grid;grid-template-columns:1fr;gap:2px}
.fx div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.fx div:last-child{border:0}.fx span{color:var(--mut);flex:none}.fx b{font-weight:600;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tag{background:var(--cobg);color:var(--co);border-radius:8px;padding:2px 9px;font-weight:700;font-size:14px}
.strip{display:flex;gap:4px;direction:ltr;margin:8px 0 2px}
.strip i{flex:1;min-width:0;font-style:normal;text-align:center;font-size:10.5px;padding:5px 0;border-radius:7px;border:1px solid var(--line);color:var(--mut);overflow:hidden}
.strip i.p{background:var(--pr);color:var(--card);border-color:var(--pr);font-weight:800}
.strip i.on{outline:2px solid var(--ink);outline-offset:1px}
.cap{font-size:11.5px;color:var(--mut)}
.ok{color:var(--pr);font-weight:800}.bad{color:var(--co);font-weight:800}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}#log{scroll-behavior:auto}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.bar{display:flex;gap:8px;padding:10px 14px 14px;background:var(--card);border-top:1px solid var(--line)}
.bar[hidden]{display:none}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;direction:ltr;text-align:left}
.send,.big{border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;padding:11px 18px}
.send{background:var(--acc);color:#101a33}
.big{flex:1;font-size:15px}.big.p{background:var(--prbg);color:var(--pr)}.big.c{background:var(--cobg);color:var(--co)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{background:transparent;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{background:linear-gradient(135deg,var(--card),var(--bg));box-shadow:0 6px 24px -14px rgba(16,26,51,.5)}
.logo{background:linear-gradient(145deg,#172554,#0b1024);box-shadow:0 0 0 2px var(--acc),0 0 22px rgba(242,169,0,.42);position:relative;overflow:hidden}
.logo svg{width:34px;height:34px;display:block}
.geoInfo{padding:10px 13px;line-height:2;max-height:115px}
.geoInfo .infoTitle{display:block;font-weight:800;font-size:14px;color:var(--pr);margin-bottom:4px}
.geoInfo .infoRow{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 3px}
.geoInfo .infoRow b{font-weight:800;color:var(--ink)}
.geoInfo .infoGroup{display:flex;flex-wrap:wrap;gap:4px}
.geoHead strong{font-family:Vazirmatn,'Noto Nastaliq Urdu',sans-serif}

.bot{box-shadow:0 8px 24px -16px rgba(16,26,51,.6)}
.vd{position:relative;overflow:hidden;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.vd.p{box-shadow:inset 0 0 0 1.5px var(--pr),0 8px 26px -10px var(--pr)}
.vd.c{box-shadow:inset 0 0 0 1.5px var(--co),0 8px 26px -10px var(--co)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.ul{display:block;width:100%;max-width:300px;margin:10px auto 2px;border-radius:12px;background:var(--bg);padding:6px}
.ul .p{fill:var(--pr)}.ul .c{fill:var(--line)}.ul .on{fill:var(--ink)}
.tm{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:0 14px 8px}
.tm i{display:block;height:100%;background:linear-gradient(90deg,var(--co),var(--acc));transform-origin:right;animation:tm 20s linear forwards}

.wm{align-self:flex-start;direction:ltr;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mut);padding:0 14px 6px;width:100%;background:var(--card)}

@media (prefers-reduced-motion:reduce){.vd{animation:none}.tm i{animation-duration:20s}}

.cb{border:0;background:var(--acc);color:#101a33;border-radius:10px;height:36px;padding:0 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
@media (max-width:430px){header small{display:none}.st{gap:8px}header{gap:8px;padding:10px}}
#sp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#2a4080,#101a33 70%);color:#fff;transition:opacity .6s,visibility .6s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#sp.out{opacity:0;visibility:hidden}
.spi{display:flex;flex-direction:column;align-items:center;gap:20px;animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
.spl{width:86px;height:86px;border-radius:24px;background:#101a33;color:#f2a900;display:grid;place-items:center;font-weight:800;font-size:26px;direction:ltr;box-shadow:0 0 0 3px #f2a900,0 0 40px rgba(242,169,0,.55)}
#sp h2{margin:0;font-size:38px;font-weight:800;letter-spacing:1px;direction:ltr}
#sb{border:0;border-radius:12px;background:#f2a900;color:#101a33;font:inherit;font-weight:800;font-size:16px;padding:11px 36px;cursor:pointer}
.spt{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.spt i{display:block;height:100%;background:#f2a900;transform-origin:right;animation:tm 3.5s linear forwards}
.sv{display:grid;direction:ltr;gap:3px;margin:8px 0}
.sv i{font-style:normal;text-align:center;font-size:11px;padding:6px 0;border-radius:6px;border:1px solid var(--line);color:var(--ink);min-width:0;transition:background .35s,color .35s}
.sv i.one{background:var(--bg);color:var(--mut)}
.sv i.x{background:var(--c);color:#fff;border-color:var(--c);text-decoration:line-through}
.sv i.pr{background:var(--pr);color:var(--card);border-color:var(--pr);font-weight:800}
.lg{display:flex;flex-wrap:wrap;gap:6px}
.lg span{background:var(--c);color:#fff;border-radius:8px;padding:1px 9px;font-size:12px;font-weight:700}
.orb{position:relative;width:150px;height:150px;display:grid;place-items:center}
.orb>i{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(242,169,0,.55);animation:spin 8s linear infinite}
.orb>i:nth-child(2){inset:16px;animation-duration:5s;animation-direction:reverse;border-color:rgba(255,255,255,.35)}
.orb>i:nth-child(3){inset:-16px;animation-duration:13s;border-style:dotted;border-color:rgba(242,169,0,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
#sh span{display:inline-block;animation:up .55s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.spt{width:170px}.spt i{animation:gr 3.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes gr{from{transform:scaleX(0)}}
.sps{font-size:13px;color:rgba(255,255,255,.75);min-height:20px}
#sp{cursor:pointer}
@media (prefers-reduced-motion:reduce){.orb>i,#sh span,.spt i{animation:none}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.up{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:4px;object-fit:contain}
.bot.ai{white-space:pre-wrap}
#pic{align-self:center;width:42px;height:42px;flex:none}
.tb{width:100%;border-collapse:collapse;direction:ltr;font-size:12px;margin:6px 0}
.tb td,.tb th{border:1px solid var(--line);padding:4px 2px;text-align:center}.tb th{background:var(--bg)}
.bar{flex-wrap:wrap}.sv{gap:4px}.sv i{font-size:12.5px;padding:9px 0}.tp .fx b{text-align:right}
.kb{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;direction:ltr;padding-top:6px}.kb[hidden]{display:none}
.kb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation}.kb button:active{background:var(--acc);color:#101a33}

/* ---------- interactive geometry studio ---------- */
#geoOpen{border:0;border-radius:10px;background:var(--prbg);color:var(--ink);padding:9px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
#geoPanel{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;color:var(--ink)}
#geoPanel[hidden]{display:none}
.geoHead{display:flex;align-items:center;gap:8px;padding:10px;background:var(--card);border-bottom:1px solid var(--line)}
.geoHead strong{font-size:15px;margin-inline-end:auto}.geoHead button,.geoTools button,.geoFoot button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;cursor:pointer;touch-action:manipulation}
.geoTools{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.geoTools button{white-space:nowrap;font-size:12px}.geoTools button.active{background:var(--prbg);border-color:var(--pr);font-weight:800}
.geoGroup{position:relative;flex-shrink:0}.geoSub{display:none;position:absolute;z-index:20;top:100%;right:0;min-width:135px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px #15213a22;gap:5px;flex-direction:column}.geoGroup.open .geoSub{display:flex}.geoSub button{width:100%;text-align:right}.geoInfo{padding:7px 11px;background:var(--card);border-top:1px solid var(--line);font-size:12px;line-height:1.9;color:var(--ink);max-height:100px;overflow:auto}.geoFoot #geoZoomVal{font-size:11px;min-width:38px;text-align:center;direction:ltr}.geoTools{overflow:visible;flex-wrap:wrap;position:relative;z-index:5}
#geoCanvas{display:block;width:100%;flex:1;min-height:0;touch-action:none;background:var(--card)}
.geoFoot{display:flex;align-items:center;gap:8px;padding:8px;background:var(--card);border-top:1px solid var(--line);font-size:12px}.geoFoot span{flex:1;color:var(--mut)}
@media(max-width:430px){header{gap:6px;padding:9px}.st{font-size:10px}#geoOpen{padding:8px 7px}.geoHead strong{font-size:13px}}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="sp" aria-label="NSH.made"><div class="spi"><div class="orb"><i></i><i></i><i></i><div class="spl">NSH</div></div><h2 id="sh">NSH.made</h2><div class="spt"><i></i></div><div class="sps" id="ss">در حال آماده‌سازی…</div></div></div>
<div class="app">
<header>
  <div class="logo" aria-label="نشان NSH"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 29V11L20 25V11M25 11H33V29H25" stroke="#f2a900" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="7" r="2" fill="#fff"/><path d="M4 33H36" stroke="#f2a900" stroke-width="1.5" stroke-linecap="round" opacity=".8"/></svg></div>
  <div><h1>NSH.bot</h1><small>تحلیل‌گر اعداد اول و مرکب</small></div>
  <div class="st"><div>امتیاز<b id="sc">۰</b></div><div>رکورد<b id="bs">۰</b></div></div>
  <button class="cb" id="cb">🎯 چالش</button>
  <button id="geoOpen" type="button">📐 رسم هندسه</button>
  <button class="ib" id="th" aria-label="تغییر پوسته">◐</button>
</header>
<div id="log" aria-live="polite"></div>
<div class="tm" id="tm" hidden><i></i></div>
<div class="bar" id="ask" hidden><button class="big p" id="bp">اول است</button><button class="big c" id="bc">مرکب است</button></div>
<div class="bar" id="nx" hidden><button class="big p" id="bn">چالش بعدی</button><button class="big c" id="bx">خروج</button></div>
<form class="bar" id="f" autocomplete="off">
  <input id="in" inputmode="text" placeholder="عدد یا محاسبه، مثل 12×7" aria-label="عدد">
  <button type="button" class="ib" id="kt" aria-label="کیبورد ریاضی">⌨</button>
  <button type="button" class="ib" id="pic" hidden aria-label="ارسال عکس برای تحلیل">📎</button><input type="file" id="fi" accept="image/*" hidden>
  <button class="send">تحلیل</button>
<div class="kb" id="kb" hidden></div>

<section id="geoPanel" hidden aria-label="محیط رسم هندسه">
 <div class="geoHead"><strong>📐 کارگاه هندسهٔ NSH.bot</strong><button id="geoUndo" type="button">↶ بازگشت</button><button id="geoClear" type="button">پاک‌کردن</button><button id="geoClose" type="button">✕ بستن</button></div>
 <div class="geoTools" role="toolbar" aria-label="ابزارهای رسم">
  <button data-tool="move" class="active">✋ جابه‌جایی</button><button data-tool="point">• نقطه</button>
  <div class="geoGroup"><button type="button" id="geoLineMenu">خط ▾</button><div class="geoSub" id="geoLineSub"><button data-tool="line">خط راست</button><button data-tool="dashedline">خط‌چین</button><button data-tool="ray">نیم‌خط</button><button data-tool="segment">پاره‌خط</button></div></div>
  <div class="geoGroup"><button type="button" id="geoShapeMenu">شکل ▾</button><div class="geoSub" id="geoShapeSub"><button data-tool="polygon">چندضلعی آزاد</button><button data-tool="triangle">مثلث</button><button data-tool="square">مربع</button><button data-tool="rectangle">مستطیل</button><button data-tool="circle">دایره</button><button data-tool="semicircle">نیم‌دایره</button><button data-tool="ellipse">بیضی</button></div></div>
 </div>
 <canvas id="geoCanvas" aria-label="صفحه مختصات تعاملی"></canvas>
 <div id="geoInfo" class="geoInfo">یک نقطه یا شکل را انتخاب کن تا مختصات و ویژگی‌های اصلی آن نمایش داده شود.</div>
 <div class="geoFoot"><span id="geoHelp">برای جابه‌جایی، صفحه را بکش؛ برای زوم از دو انگشت یا چرخ ماوس استفاده کن.</span><button id="geoZoomOut" type="button">−</button><span id="geoZoomVal">1×</span><button id="geoZoomIn" type="button">＋</button><button id="geoHome" type="button">مرکز</button></div>
</section>

<script>
const $=i=>document.getElementById(i);
const log=$('log'),inp=$('in');
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sup=e=>String(e).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const dig=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fmt=n=>'<span class="num">'+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</span>';
const row=(l,v)=>'<div><span>'+l+'</span><b>'+v+'</b></div>';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function add(html,cls,text){const d=document.createElement('div');d.className='m '+cls;if(text!==undefined)d.textContent=text;else d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(html,delay=350){const t=add('<span class="dots"><span></span><span></span><span></span></span>','bot t');return new Promise(r=>setTimeout(()=>{t.className='m bot';t.innerHTML=html;log.scrollTop=log.scrollHeight;r()},delay))}

/* ---------- math ---------- */
const SM=[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n],DET=3317044064679887385961981n;
const mod=(b,e,m)=>{let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};
function isPrime(n){
  if(n<2n)return false;
  for(const p of SM){if(n===p)return true;if(n%p===0n)return false}
  let d=n-1n,s=0;while(d%2n===0n){d/=2n;s++}
  for(const a of SM){let x=mod(a,d,n);if(x===1n||x===n-1n)continue;let ok=false;
    for(let i=1;i<s;i++){x=x*x%n;if(x===n-1n){ok=true;break}}if(!ok)return false}
  return true}
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a};
function rho(n,dead){
  if(n%2n===0n)return 2n;
  for(let c=1n;c<40n;c++){let x=2n,y=2n,d=1n,i=0;
    while(d===1n){x=(x*x+c)%n;y=(y*y+c)%n;y=(y*y+c)%n;d=gcd(x>y?x-y:y-x,n);if((++i&1023)===0&&Date.now()>dead)return null}
    if(d!==n)return d}
  return null}
function factorize(n){
  const f=new Map(),add=p=>f.set(p,(f.get(p)||0n)+1n),unf=[];

  const dead=Date.now()+3000,st=[n];
  while(st.length){const x=st.pop();if(x===1n)continue;if(isPrime(x)){add(x);continue}
    const d=rho(x,dead);if(!d){unf.push(x);continue}st.push(d,x/d)}
  return{f,unf}}
const nextPrime=n=>{let k=n+1n;while(!isPrime(k))k++;return k};
const prevPrime=n=>{let k=n-1n;while(k>=2n&&!isPrime(k))k--;return k>=2n?k:null};
const isqrt=n=>{if(n<2n)return n;let x=1n<<BigInt((n.toString(2).length+1)>>1);for(;;){const y=(x+n/x)>>1n;if(y>=x)return x;x=y}};
let SV=null;const SL=2000000;

function twoSquares(p){const s=Number(p);for(let a=1;a*a<=s/2;a++){const b2=s-a*a,b=Math.round(Math.sqrt(b2));if(b*b===b2)return[a,b]}return null}

function analyze(n){

  if(n<2n){
    return '<div class="vd z"><div class="vn">'+fmt(n)+'</div><div class="vt">نه اول، نه مرکب</div></div>'+
    '<div class="cap">'+(n===0n?'صفر را بر هر عددی می‌شود تقسیم کرد؛ برای همین در هیچ‌کدام از این دو دسته نیست.':'عدد ۱ فقط یک مقسوم‌علیه دارد (خودش)، پس نه اول است نه مرکب.')+'</div>'}

  let h=pre+'<div class="vd '+(prime?'p':'c')+'"><div class="vn">'+fmt(n)+'</div><div class="vt">'+(prime?(big?'احتمالاً اول':'اول است ✓'):'مرکب است')+'</div></div>';
  const R=[];
  if(prime){
    R.push(row('دلیل','فقط بر ۱ و خودش بخش‌پذیر است'));
    const p=prevPrime(n),q=nextPrime(n);
    R.push(row('اول قبلی',p?fmt(p):'ندارد'));
    R.push(row('اول بعدی',fmt(q)));
  }else{
    const{f,unf}=factorize(n);
    const keys=[...f.keys()].sort((a,b)=>a<b?-1:1);
    let t='<div class="tags">';
    keys.forEach((p,i)=>{t+=(i?'<span>×</span>':'')+'<span class="tag"><span class="num">'+p+(f.get(p)>1n?sup(f.get(p)):'')+'</span></span>'});
    unf.forEach(u=>{t+='<span>×</span><span class="tag"><span class="num">'+u+'</span>؟</span>'});
    h+='<div class="cap">تجزیه به عامل‌های اول</div>'+t+'</div>';
    if(unf.length)R.push(row('توجه','بخشی از عدد در زمان مجاز تجزیه نشد (علامت ؟)'));
    else{
      let dc=1n;f.forEach(e=>{dc*=e+1n});
      R.push(row('تعداد مقسوم‌علیه‌ها',fa(dc)));
      if(dc<=48n){let ds=[1n];f.forEach((e,p)=>{const nd=[];for(const d of ds){let m=1n;for(let i=0n;i<=e;i++){nd.push(d*m);m*=p}}ds=nd});
        ds.sort((a,b)=>a<b?-1:1);R.push(row('مقسوم‌علیه‌ها','<span class="num">'+ds.join('، ')+'</span>'))}
    }
    R.push(row('کوچک‌ترین مقسوم‌علیه اول','<span class="num">'+(keys[0]||'؟')+'</span>'));
    const r=isqrt(n);if(r*r===n)R.push(row('مربع کامل',fmt(r)+'²'));
  }
  const dv=[];if(n%2n===0n)dv.push('۲');if(n%3n===0n)dv.push('۳');if(n%5n===0n)dv.push('۵');
  R.push(row('بخش‌پذیر بر',dv.length?dv.join('، '):'نه ۲، نه ۳، نه ۵'));
  R.push(row('زوج یا فرد',n%2n===0n?'زوج':'فرد'));
  const ds=n.toString().split('').reduce((a,c)=>a+ +c,0);
  R.push(row('مجموع ارقام',fa(ds)+(ds%3===0?' (پس بر ۳ بخش‌پذیر است)':'')));
  h+='<div class="fx">'+R.join('')+'</div>';
  if(n<10n**15n){let s='<div class="strip">';for(let k=-4;k<=4;k++){const m=n+BigInt(k);s+='<i class="'+(m>=2n&&isPrime(m)?'p':'')+(k===0?' on':'')+'">'+(m<0n?'·':m)+'</i>'}
    h+=s+'</div><div class="cap">عددهای کنار آن: خانهٔ زرد یعنی اول</div>'}
  return h}

const RB=(n,d=1n)=>{if(d<0n){n=-n;d=-d}const g=gcd(n<0n?-n:n,d)||1n;return{n:n/g,d:d/g}};
function mathNorm(w){
  const s=w.replace(/٫/g,'.').replace(/[×⋅∗]/g,'*').replace(/[÷:]/g,'/').replace(/[−–]/g,'-').replace(/\*\*/g,'^')
   .replace(/جمع|بعلاوه|به‌علاوه/g,'+').replace(/منفی|تفریق/g,'-').replace(/ضرب/g,'*').replace(/تقسیم/g,'/').replace(/توان/g,'^').replace(/باقی‌?مانده/g,'%').replace(/ریشه/g,'√')
   .replace(/(\d)\s*[xX]\s*(?=[\d(])/g,'$1*').replace(/[,،٬\s]/g,'');
  return /^[\d+\-*\/^%!√().]+$/.test(s)&&/\d/.test(s)&&/[+\-*\/^%!√(]/.test(s)&&!/^[+-]?\d+$/.test(s)?s:null}
function calc(S){
  let i=0,approx=false;const ex=m=>{throw{fa:m}};
  const dg=r=>Math.max(r.n.toString().length,r.d.toString().length);
  function expr(){let a=term();while(S[i]==='+'||S[i]==='-'){const o=S[i++],b=term();a=o==='+'?RB(a.n*b.d+b.n*a.d,a.d*b.d):RB(a.n*b.d-b.n*a.d,a.d*b.d)}return a}
  function term(){let a=un();while(S[i]==='*'||S[i]==='/'||S[i]==='%'||S[i]==='('){const o=S[i]==='('?'*':S[i++],b=un();
    if(o==='*')a=RB(a.n*b.n,a.d*b.d);
    else if(o==='/'){if(b.n===0n)ex('تقسیم بر صفر ممکن نیست.');a=RB(a.n*b.d,a.d*b.n)}
    else{if(a.d!==1n||b.d!==1n)ex('باقی‌مانده فقط برای عددهای صحیح است.');if(b.n===0n)ex('تقسیم بر صفر ممکن نیست.');a=RB(a.n%b.n)}
    if(dg(a)>4000)ex('نتیجه خیلی بزرگ است.')}return a}
  function un(){if(S[i]==='-'){i++;const a=un();return RB(-a.n,a.d)}if(S[i]==='+'){i++;return un()}return pw()}
  function pw(){const a=pf();if(S[i]==='^'){i++;const b=un();if(b.d!==1n)ex('توان باید عدد صحیح باشد.');let e=b.n;if(e>2000n||e<-2000n||dg(a)*Number(e<0n?-e:e)>4000)ex('توان خیلی بزرگ است.');let x=a;if(e<0n){if(x.n===0n)ex('تقسیم بر صفر ممکن نیست.');x=RB(x.d,x.n);e=-e}return RB(x.n**e,x.d**e)}return a}
  function pf(){let a=pr();while(S[i]==='!'){i++;if(a.d!==1n||a.n<0n||a.n>500n)ex('فاکتوریل فقط برای عدد صحیح ۰ تا ۵۰۰ است.');let f=1n;for(let k=2n;k<=a.n;k++)f*=k;a=RB(f)}return a}
  function pr(){
    if(S[i]==='('){i++;const a=expr();if(S[i]!==')')ex('پرانتز بسته نشده است.');i++;return a}
    if(S[i]==='√'){i++;const a=pr();if(a.n<0n)ex('ریشهٔ عدد منفی تعریف نشده است.');const rn=isqrt(a.n),rd=isqrt(a.d);if(rn*rn===a.n&&rd*rd===a.d)return RB(rn,rd);approx=true;const K=10n**20n;return RB(isqrt(a.n*K*K/a.d),K)}
    const m=S.slice(i).match(/^(\d+)(?:\.(\d+))?/);if(!m)ex('عبارت را نفهمیدم.');i+=m[0].length;const f=m[2]||'';return RB(BigInt(m[1]+f),10n**BigInt(f.length))}
  const r=expr();if(i<S.length)ex('عبارت را نفهمیدم.');return{r,approx}}
function dec(r){const neg=r.n<0n,n=neg?-r.n:r.n;let rem=n%r.d,fr='';for(let j=0;j<10;j++){rem*=10n;fr+=rem/r.d;rem%=r.d}fr=fr.replace(/0+$/,'');return '<span class="num">'+(neg?'-':'')+n/r.d+'.'+(fr||'0')+(rem?'…':'')+'</span>'}
function mathCard(S,r,approx){

  let main,R=[],cap='';

/* ---------- trigonometry ---------- */
const TRIGRE=/(sin|cos|tan|cot|کسینوس|کتانژانت|سینوس|تانژانت)\s*\(?\s*(-?\d+(?:\.\d+)?)\s*(?:°|درجه)?\s*\)?/i;
const TRIGMAP={sin:'sin',cos:'cos',tan:'tan',cot:'cot','سینوس':'sin','کسینوس':'cos','تانژانت':'tan','کتانژانت':'cot'};
const TEX={0:{s:'0',c:'1',t:'0'},30:{s:'1/2',c:'√3/2',t:'√3/3'},45:{s:'√2/2',c:'√2/2',t:'1'},60:{s:'√3/2',c:'1/2',t:'√3'},90:{s:'1',c:'0',t:null}};
const r4=x=>{const r=Math.round(x*1e4)/1e4;return String(Object.is(r,-0)?0:r)};
const NS=x=>'<span class="num">'+x+'</span>';
function trigCard(fn,deg){

  const R=[];let ex=null;

    const q=th<90?1:th<180?2:th<270?3:4,ref=q===1?th:q===2?180-th:q===3?th-180:360-th;
    const ss=q<=2?1:-1,cc=(q===1||q===4)?1:-1,sg=(s,x)=>x==='0'?'0':(s<0?'−':'')+x;
    if(TEX[ref]){

      else if(fn==='tan')ex=TEX[ref].t===null?null:sg(ss*cc,TEX[ref].t);

  if(!und&&ex)R.unshift(row('مقدار دقیق',NS(ex)));

function triCard(ns){

let svc=0;

  const cells=[...g.children],done=new Uint8Array(N+1),lim=Math.floor(Math.sqrt(N));

    for(let m=p*p;m<=N;m+=p)if(!done[m]){done[m]=1;cells[m-1].className='x';cells[m-1].style.setProperty('--c',col)}
    lg.insertAdjacentHTML('beforeend','<span style="--c:'+col+'">ضرب‌های '+fa(p)+'</span>');

  cap.innerHTML='تمام شد! خانه‌های زرد اول‌اند: <b>'+fa(cnt)+'</b> عدد تا '+fa(N)+'.';
  log.scrollTop=log.scrollHeight}
/* ---------- challenge ---------- */
async function challenge(){
  const d=Math.min(2+Math.floor(streak/2),12);let s=String(1+Math.floor(Math.random()*9));for(let i=1;i<d;i++)s+=Math.floor(Math.random()*10);
  let n=BigInt(s);if(Math.random()<.5)n=nextPrime(n);else if(isPrime(n))n+=1n;
  cur=n;bars('ask');await say('<b>چالش'+(streak?' — '+fa(streak)+' پیاپی 🔥':'')+'</b>\nعدد '+fmt(n)+' اول است یا مرکب؟\n<span class="cap">۲۰ ثانیه وقت داری ⏱</span>',300)}
async function answer(g){
  if(cur===null)return;const n=cur,ok=g!==null&&isPrime(n)===g;cur=null;
  add('','me',g===null?'⏱ وقت تمام شد':g?'اول است':'مرکب است');bars('next');
  if(ok){score+=10+streak*3;streak++;$('sc').textContent=fa(score);if(score>best){best=score;ls.set('nsh-best',best);ls.set('nsh-sig',sig(best));$('bs').textContent=fa(best)}}else streak=0;
  lastN=n;await say((ok?'<span class="ok">درست گفتی! ✓</span>':'<span class="bad">اشتباه بود ✗</span>')+'\n'+analyze(n))}
$('bp').onclick=()=>answer(true);$('bc').onclick=()=>answer(false);

const CP=[];let need=null;
const rowsOf=o=>o[3].split('~').map(r=>{const[l,v]=r.split('::');return row(l,/[\u0600-\u06FF]/.test(v)?v:NS(v))}).join('');
const card=o=>'<div class="tp"><b>'+o[0]+'</b> <span class="cap">('+(o[2]==='g'?'هندسه':'جبر')+' هشتم)</span><div class="fx">'+rowsOf(o)+'</div><div style="margin:6px 0">مثال: '+o[4]+'</div><div class="tags"><button class="chip" data-q="توضیح '+o[0]+'">🗣 توضیح برای دیگران</button></div></div>';
function expl(o){const tx='سلام! می‌خواهم «'+o[0]+'» را ساده برایت توضیح بدهم 🙂\n'+o[3].split('~').map((r,i)=>fa(i+1)+') '+r.replace('::',': ')).join('\n')+'\nمثال: '+o[4]+'\nحالا خودت یک مثال مشابه حل کن تا مطمئن شوم یاد گرفتی!';CP.push(tx);
  return '<div style="white-space:pre-wrap">'+tx+'</div><div class="tags"><button class="chip" data-cp="'+(CP.length-1)+'">📋 کپی / ارسال برای دیگران</button></div>'}
function menu(g,a,ex){const ch=(k,ti)=>'<div class="cap" style="margin-top:6px">'+ti+'</div><div class="tags">'+T.filter(o=>o[2]===k).map(o=>'<button class="chip" data-q="'+(ex?'توضیح ':'')+o[0]+'">'+o[0]+'</button>').join('')+'</div>';
  return (ex?'کدام مبحث را برای دیگران توضیح بدهم؟':'یک مبحث را انتخاب کن:')+(g?ch('g','📐 هندسهٔ هشتم'):'')+(a?ch('a','🧮 جبر هشتم'):'')}
async function extra(w){
  const z=w.replace(/\u200c/g,'');
  if(/=/.test(z)&&/x/i.test(z)&&/^[\dx+\-*\/().=\s×÷−]+$/i.test(z)){await say(eqCard(z.replace(/[×⋅]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'').replace(/X/g,'x')),300);return true}
  const nd=!/\d/.test(z),ex=/توضیح|آموزش|یاد بده|یادم بده|برای (?:دوست|برادر|خواهر|داداش|همکلاسی)/.test(z),hit=nd&&T.find(o=>new RegExp(o[1]).test(z));
  if(hit){if(hit[0][0]==='ع')need='مثلث';await say(ex?expl(hit):card(hit),250);return true}
  const g=/هندسه/.test(z),a=/جبر/.test(z);
  if(nd&&(g||a||ex||/مباحث|فهرست|موضوعات/.test(z))){await say(menu(g||!a,a||!g,ex),250);return true}
  return false}
function linp(S){let i=0;const ex=m=>{throw{fa:m}},Z=RB(0n),ad=(r,s)=>RB(r.n*s.d+s.n*r.d,r.d*s.d),mu=(r,s)=>RB(r.n*s.n,r.d*s.d),P=(a,b)=>({a,b}),
  ng=q=>P(RB(-q.a.n,q.a.d),RB(-q.b.n,q.b.d)),sm=(p,q)=>P(ad(p.a,q.a),ad(p.b,q.b)),
  ml=(p,q)=>{if(p.a.n&&q.a.n)ex('معادله باید درجهٔ اول باشد (x² نداریم).');return P(ad(mu(p.a,q.b),mu(p.b,q.a)),mu(p.b,q.b))},
  dv=(p,q)=>{if(q.a.n)ex('تقسیم بر x پشتیبانی نمی‌شود.');if(!q.b.n)ex('تقسیم بر صفر ممکن نیست.');const v=RB(q.b.d,q.b.n);return P(mu(p.a,v),mu(p.b,v))};
  function expr(){let a=term();while(S[i]==='+'||S[i]==='-'){const o=S[i++],b=term();a=sm(a,o==='+'?b:ng(b))}return a}
  function term(){let a=un();for(;;){const c=S[i];if(c==='*'||c==='/'){i++;const b=un();a=c==='*'?ml(a,b):dv(a,b)}else if(c==='x'||c==='(')a=ml(a,pf());else return a}}
  function un(){if(S[i]==='-'){i++;return ng(un())}if(S[i]==='+'){i++;return un()}return pf()}
  function pf(){if(S[i]==='('){i++;const a=expr();if(S[i]!==')')ex('پرانتز بسته نشده است.');i++;return a}if(S[i]==='x'){i++;return P(RB(1n),Z)}
    const m=S.slice(i).match(/^(\d+)(?:\.(\d+))?/);if(!m)ex('عبارت را نفهمیدم.');i+=m[0].length;const f=m[2]||'';return P(Z,RB(BigInt(m[1]+f),10n**BigInt(f.length)))}
  const r=expr();if(i<S.length)ex('عبارت را نفهمیدم.');return r}
function eqCard(s){try{const q=s.split('=');if(q.length!==2||!q[0]||!q[1])throw{fa:'یک علامت = با دو طرف لازم است.'};
  const L=linp(q[0]),R=linp(q[1]),f=r=>r.d===1n?String(r.n):r.n+'/'+r.d,sg=r=>r.n<0n?'−'+f(RB(-r.n,r.d)):f(r),
  a=RB(L.a.n*R.a.d-R.a.n*L.a.d,L.a.d*R.a.d),b=RB(R.b.n*L.b.d-L.b.n*R.b.d,R.b.d*L.b.d);
  if(!a.n)return '<div class="cap num">'+s+'</div>'+(b.n?'<span class="bad">این معادله جواب ندارد.</span>':'<span class="ok">همیشه درست است؛ بی‌شمار جواب دارد.</span>');
  const x=RB(b.n*a.d,b.d*a.n),ev=(p,v)=>RB(p.a.n*v.n*p.b.d+p.b.n*p.a.d*v.d,p.a.d*v.d*p.b.d),lv=ev(L,x),rv=ev(R,x);
  const rw=[row('x ها چپ، عددها راست',NS(sg(a)+'x = '+sg(b))),row('تقسیم بر ضریب',NS('x = '+sg(b)+' ÷ '+sg(a)+' = '+sg(x)))];
  if(x.d!==1n)rw.push(row('اعشاری',dec(x)));rw.push(row('بررسی',NS(sg(lv)+' = '+sg(rv)+' ✓')));
  return '<div class="cap num">'+s+'</div><div class="vd z"><div class="vn">'+NS('x = '+sg(x))+'</div><div class="vt">جواب</div></div><div class="fx">'+rw.join('')+'</div>'}
  catch(e){return '<span class="bad">'+(e&&e.fa?e.fa:'نتوانستم معادله را حل کنم.')+'</span>\nمثال: <span class="num">2x+3=11</span>'}}
/* ---------- consecutive messages + AI ---------- */
const HIST=[];let AI=null;
(async()=>{try{if(window.claude)AI=await claude.use('sample')}catch(e){}})();
async function askAI(raw){if(!AI)return false;const t=add('<span class="dots"><span></span><span></span><span></span></span>','bot t');
  const p='تو NSH.bot هستی، دستیار ریاضی دانش‌آموز پایهٔ هشتم (عدد اول، هندسه، جبر، مثلثات). پیام‌های پشت‌سرهم یک گفتگو هستند؛ ادامهٔ حرف قبلی را بفهم. فارسی ساده و کوتاه، فقط متن ساده بدون مارک‌داون.\nپیام‌های اخیر کاربر:\n'+HIST.map(h=>'- '+h.s).join('\n')+'\nبه همهٔ این پیام‌ها به‌صورت یک پرسش کامل پاسخ بده.';
  try{await AI(p,{modelTier:'default',cache:false,onText:({text})=>{t.className='m bot ai';t.textContent=text;log.scrollTop=log.scrollHeight}})}catch(e){t.className='m bot';t.textContent=(e&&e.text)||'پاسخ هوشمند در دسترس نیست؛ «راهنما» را بزن.'}return true}
async function handle(raw){
  const now=Date.now(),pv=HIST[HIST.length-1];HIST.push({s:raw,t:now});if(HIST.length>8)HIST.shift();
  const nd=need;need=null;
  if(nd&&pv&&now-pv.t<120000&&/^[\d\s.,۰-۹٠-٩]+$/.test(raw)&&(await handle0(nd+' '+raw))!==false)return;
  if((await handle0(raw))!==false)return;
  if(pv&&now-pv.t<90000&&(await handle0(pv.s+' '+raw))!==false)return;
  if(await askAI(raw))return;
  await say('این را متوجه نشدم. عدد بفرست، «هندسه»، «جبر»، «2x+3=11» یا «راهنما» را بزن.')}
const go=async r=>{if(mode!=='chat')return;add('','me',r);try{await handle(r)}catch(err){say('خطا در پردازش. ورودی را بررسی کن.')}};
log.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.chip');if(!b)return;
  if(b.dataset.q)go(b.dataset.q);
  else if(b.dataset.cp!==undefined){const s=CP[+b.dataset.cp];Promise.resolve().then(()=>navigator.share?navigator.share({text:s}):navigator.clipboard.writeText(s)).then(()=>{b.textContent='✓ انجام شد'}).catch(()=>{})}});
/* ---------- math keyboard ---------- */
(function(){const K=[['sin(','cos(','tan(','cot(','°','⌫'],['7','8','9','÷','(',')'],['4','5','6','×','^','√'],['1','2','3','−','π','x'],['0','.','=','+','%','↵'],['−','+','×','÷','C','√']],kb=$('kb');
  kb.innerHTML=K.map(r=>r.map(k=>'<button type="button" data-k="'+k+'">'+k.trim()+'</button>').join('')).join('');
  kb.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.k,s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;
    if(k==='C')inp.value='';else if(k==='↵')$('f').requestSubmit();
    else if(k==='⌫'){if(s!==e2)inp.setRangeText('',s,e2,'end');else if(s>0)inp.setRangeText('',s-1,s,'end')}
    else inp.setRangeText(k,s,e2,'end')};
  $('kt').onclick=()=>{const on=kb.hidden;kb.hidden=!on;inp.inputMode=on?'none':'text'}})();
</script>
